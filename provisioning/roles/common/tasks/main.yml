---
- name: Refresh package metadata
  apt: {update_cache: true, cache_valid_time: 3600}
- name: Install common tools
  apt:
    name: [python3, curl, jq, ca-certificates, tcpdump, chrony]
    state: present
- name: Check that the platform supplied a trainee public key
  assert:
    that:
      - global_ssh_public_user_key is defined or trainee_ssh_public_key_path is defined
    fail_msg: Supply global_ssh_public_user_key from the platform or trainee_ssh_public_key_path on the Ansible controller.
- name: Create the platform trainee account
  user:
    name: '{{ trainee_user }}'
    shell: /bin/bash
    groups: sudo
    append: true
    create_home: true
    password: '{{ trainee_password_hash | default(omit, true) }}'
  no_log: true
- name: Create the trainee SSH directory
  file:
    path: '/home/{{ trainee_user }}/.ssh'
    state: directory
    owner: '{{ trainee_user }}'
    group: '{{ trainee_user }}'
    mode: '0700'
- name: Authorize the platform-generated trainee SSH key
  copy:
    src: '{{ trainee_ssh_public_key_path | default(global_ssh_public_user_key) }}'
    dest: '/home/{{ trainee_user }}/.ssh/authorized_keys'
    owner: '{{ trainee_user }}'
    group: '{{ trainee_user }}'
    mode: '0600'
- name: Permit the lab defender to use sudo
  copy:
    dest: /etc/sudoers.d/90-cadmus-trainee
    mode: '0440'
    content: |
      {{ trainee_user }} ALL=(ALL) NOPASSWD:ALL
    validate: 'visudo -cf %s'
- name: Permit optional browser-console password authentication for the trainee
  blockinfile:
    path: /etc/ssh/sshd_config
    marker: '# {mark} CADMUS TRAINEE CONSOLE'
    block: |
      Match User {{ trainee_user }}
        PasswordAuthentication yes
      Match all
    validate: '/usr/sbin/sshd -t -f %s'
    backup: true
  when: trainee_password_hash | length > 0
  register: trainee_console_config
- name: Validate optional SSH console configuration
  command: /usr/sbin/sshd -t
  changed_when: false
  when: trainee_console_config.changed
- name: Reload SSH after the optional console configuration
  service: {name: ssh, state: reloaded}
  when: trainee_console_config.changed
- name: Keep lab timestamps synchronized
  service: {name: chrony, state: started, enabled: true}
- name: Create helper directory
  file: {path: /opt/cr-dos, state: directory, mode: '0755'}
- name: Install fixed lab host aliases
  blockinfile:
    path: /etc/hosts
    marker: '# {mark} CADMUS CR20 LAB'
    block: |
      10.10.0.10 siem kibana elasticsearch
      10.10.0.20 sensor
      10.10.0.30 web-waf web waf
      10.10.0.40 attacker
- name: Install common exercise tools
  copy:
    src: '{{ playbook_dir }}/files/{{ item }}'
    dest: '/opt/cr-dos/{{ item }}'
    mode: '0755'
  loop: [traffic.py, health.py, metrics.py, verify_stage.py, incident.py, capstone.py]
